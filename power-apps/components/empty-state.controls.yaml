- conEmptyState:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutJustifyContent: =LayoutJustifyContent.Center
      LayoutGap: =6
      PaddingTop: =24
      PaddingBottom: =24
      Visible: =IsEmpty(galWorkQueue.AllItems)
    Children:
      - icoEmptyState:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Search
            Color: =RGBA(138,136,134,1)
            Width: =36
            Height: =36
            AccessibleLabel: ="No results"
      - lblEmptyStateTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="No matching work"
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
      - lblEmptyStateMessage:
          Control: Label@2.5.1
          Properties:
            Text: ="Try clearing a filter or changing your search."
            Color: =RGBA(96,94,92,1)
            Align: =Align.Center
