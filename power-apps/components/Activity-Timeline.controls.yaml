ComponentDefinitions:
  cmpActivityTimeline:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ActiveFilter:
        PropertyKind: Output
        DisplayName: ActiveFilter
        Description: The currently selected filter value.
        DataType: Text
      CardHeight:
        PropertyKind: Input
        DisplayName: CardHeight
        Description: Height of a standard entry card with no sub-detail.
        DataType: Number
        Default: =92
      FilterOptions:
        PropertyKind: Input
        DisplayName: FilterOptions
        Description: Table of {Value:Text} rows for the filter dropdown. Values must match Category values in Items and IconMap.
        DataType: Table
        Default: |-
          =Table(
            {Value: "All Activities"},
            {Value: "Comments"},
            {Value: "Emails"},
            {Value: "Documents"},
            {Value: "Tasks"},
            {Value: "System Events"}
          )
      HideHeader:
        PropertyKind: Input
        DisplayName: HideHeader
        Description: When true hides the toolbar with filter entry count and action buttons.
        DataType: Boolean
        Default: =false
      IsLoading:
        PropertyKind: Input
        DisplayName: IsLoading
        Description: When true shows skeleton placeholder cards instead of data.
        DataType: Boolean
        Default: =false
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Audit trail entries. Schema - EventTitle, EventDescription, Author, DisplayDateTime, Category (must match FilterOptions values and IconMap), HasSubDetail, SubTo, SubCC, SubPriority (High or Normal), SubMessage. No IconType needed - derived automatically from Category via IconMap.
        DataType: Table
        Default: |-
          =colSelectedRequestActivity //Table({Title:"Comment Added",ActivityText:"I've reviewed the technical requirements. Looks good to proceed.",Author:First('IWM Request Comments List').'Created By',DateTime:"Today 2:30 PM",ActivityType:"Comment",HasSubDetail: false ,Html:""},{Title:"Email Notification Sent",ActivityText:"Request for Technical Review",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 14, 2024 3:45 PM",ActivityType:"Email",HasSubDetail: true ,Html:""},{Title:"Email Notification Sent",ActivityText:"Task Assignment Notification",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 12, 2024 9:00 AM",ActivityType:"Assignment Update",HasSubDetail: true ,Html:""},{Title:"Phase Completed",ActivityText:"Budget Review completed",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 10, 2024 2:30 PM",ActivityType:"System Note",HasSubDetail: false ,Html:""},{Title:"Task Completed",ActivityText:"Initial mission",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 10, 2024 2:30 PM",ActivityType:"Approval Note",HasSubDetail: false ,Html:""},{Title:"Document Uploaded",ActivityText:"VNS_Requirements_v2.1.pdf",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 10, 2024 2:25 PM",ActivityType:"Status Update",HasSubDetail: false ,Html:""},{Title:"Workflow Started",ActivityText:"FRM Competitive workflow initiated",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 8, 2024 9:15 AM",Category:"Status Update",HasSubDetail: false ,Html:""},{Title:"Case Created",ActivityText:"New case initiated",Author:First('IWM Request Comments List').'Created By',DateTime:"Nov 8, 2024 9:00 AM",ActivityType:"Status Update",HasSubDetail: false ,Html:""})
      OnExport:
        PropertyKind: Event
        DisplayName: OnExport
        Description: Fires when the export button is tapped.
        ReturnType: None
        Default: =false
      OnItemSelect:
        PropertyKind: Event
        DisplayName: OnItemSelect
        Description: Fires when an audit trail card is tapped.
        ReturnType: None
        Default: =false
      OnPrint:
        PropertyKind: Event
        DisplayName: OnPrint
        Description: Fires when the print button is tapped.
        ReturnType: None
        Default: =false
      SelectedItem:
        PropertyKind: Output
        DisplayName: SelectedItem
        Description: The last tapped audit trail record.
        DataType: Record
      ShowScrollbar:
        PropertyKind: Input
        DisplayName: ShowScrollbar
        Description: When true shows the scrollbar on the timeline gallery.
        DataType: Boolean
        Default: =false
      SubDetailCardHeight:
        PropertyKind: Input
        DisplayName: SubDetailCardHeight
        Description: Height of an entry card that includes the sub-detail panel.
        DataType: Number
        Default: =212
      ThemeConfig:
        PropertyKind: Input
        DisplayName: ThemeConfig
        Description: Light and Dark theme token sets. Override to customise colors.
        DataType: Record
        Default: |-
          ={
              background:       nfThemeBackground,
              surface:          nfThemeSurface,
              border:           nfThemeBorder,
              rail:             nfThemeSecondary,
              dotBorder:        nfThemeHover,
              text:             nfThemeText,
              textMuted:        nfThemeMutedText,
              textSubtle:       ColorValue("#9CA3AF"),
              toolbarSep:       ColorValue("#E5E7EB"),
              htmlBg:           "#f9fafb",
              htmlBorder:       "#e5e7eb",
              htmlText:         "#374151",
              htmlTextMuted:    "#9ca3af",
              htmlPriorityHigh: "#ef4444"
            }
    Properties:
      ActiveFilter: =If(IsBlank(_auditFilter), "All Activities", _auditFilter)
      Height: =App.Height
      OnReset: =Set(_auditFilter, Blank())
      SelectedItem: =_auditSelectedItem
      Width: =App.Width
    Children:
      - conRoot_3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =cmpActivityTimeline.ThemeConfig.background
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - conToolbar_3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfThemeSurface
                  FillPortions: =0
                  Height: =nfButtonHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  PaddingBottom: =8
                  PaddingLeft: =16
                  PaddingRight: =8
                  PaddingTop: =8
                  Visible: =!cmpActivityTimeline.HideHeader
                Children:
                  - drpActivityFilter:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        Appearance: =Appearance.Outline
                        DefaultSelectedItems: =Filter(cmpActivityTimeline.FilterOptions, Value = "All Activities")
                        Height: =nfInputHeight
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Value
                        Items: =cmpActivityTimeline.FilterOptions
                        OnChange: =Set(_auditFilter, Self.Selected.Value)
                        SelectMultiple: =false
                        Size: =13
                        Width: =180
                  - conSpacer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - lblEntryCount:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =nfThemeMutedText
                        Font: =Font.'Segoe UI'
                        Height: =32
                        LayoutMinWidth: =80
                        Size: =nfFontSizeCardTitle
                        Text: =CountRows(galTimeline.AllItems) & " entries"
                        Width: =100
                  - shpToolbarSep:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =cmpActivityTimeline.ThemeConfig.toolbarSep
                        Height: =28
                        LayoutMinWidth: =1
                        Width: =1
                  - conBtnPrint:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =nfInputHeight
                        LayoutMinWidth: =36
                        Width: =36
                      Children:
                        - imgPrintIcon:
                            Control: Image@2.2.3
                            Properties:
                              Height: =18
                              Image: ="data:image/svg+xml," & EncodeUrl("<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='" & If(gblDarkMode, "#9CA3AF", "#6B7280") & "' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 6 2 18 2 18 9'/><path d='M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2'/><rect x='6' y='14' width='12' height='8'/></svg>")
                              Width: =18
                              X: =9
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnPrintOverlay:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0.06)
                              OnSelect: =cmpActivityTimeline.OnPrint()
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0.1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Text: =""
                              Width: =36
                  - conBtnExport:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =nfInputHeight
                        LayoutMinWidth: =36
                        Width: =36
                      Children:
                        - imgExportIcon:
                            Control: Image@2.2.3
                            Properties:
                              Height: =18
                              Image: ="data:image/svg+xml," & EncodeUrl("<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='" & If(gblDarkMode, "#9CA3AF", "#6B7280") & "' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'/><polyline points='7 10 12 15 17 10'/><line x1='12' y1='15' x2='12' y2='3'/></svg>")
                              Width: =18
                              X: =9
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnExportOverlay:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0.06)
                              OnSelect: =cmpActivityTimeline.OnExport()
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0.1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Text: =""
                              Width: =36
                  - conBtnFullscreen:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =0
                        Height: =nfInputHeight
                        LayoutMinWidth: =36
                        Width: =36
                      Children:
                        - imgFullscreenIcon:
                            Control: Image@2.2.3
                            Properties:
                              Height: =18
                              Image: ="data:image/svg+xml," & EncodeUrl("<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='" & If(gblDarkMode, "#9CA3AF", "#6B7280") & "' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 3 21 3 21 9'/><polyline points='9 21 3 21 3 15'/><line x1='21' y1='3' x2='14' y2='10'/><line x1='3' y1='21' x2='10' y2='14'/></svg>")
                              Width: =18
                              X: =9
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnFullscreenOverlay:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0.06)
                              OnSelect: =Set(_auditFullscreen, !_auditFullscreen)
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0.1)
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Text: =""
                              Width: =36
            - shpHeaderDivider:
                Control: Rectangle@2.3.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =nfThemeBorder
                  Height: =1
                  Visible: =!cmpActivityTimeline.HideHeader
            - conTimelineArea:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =nfThemeBackground
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                Children:
                  - conSkeleton:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        Visible: =cmpActivityTimeline.IsLoading
                      Children:
                        - galSkeleton_2:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Height: =Parent.Height
                              Items: =Sequence(6)
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =cmpActivityTimeline.CardHeight + 32
                              Width: =Parent.Width
                            Children:
                              - conSkeletonLeft:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =cmpActivityTimeline.CardHeight + 32
                                    Width: =52
                                    X: =16
                                  Children:
                                    - shpSkeletonLine:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =nfThemeSecondary
                                          Height: =Parent.Height
                                          Width: =2
                                          X: =24
                                    - conSkeletonDot:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          Fill: =nfThemeBorder
                                          Height: =36
                                          RadiusBottomLeft: =18
                                          RadiusBottomRight: =18
                                          RadiusTopLeft: =18
                                          RadiusTopRight: =18
                                          Width: =36
                                          X: =8
                                          Y: =26
                              - conSkeletonCard_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =nfThemeBorder
                                    BorderThickness: =1
                                    Fill: =nfThemeSurface
                                    Height: =cmpActivityTimeline.CardHeight
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Width: =Parent.Width - 92
                                    X: =52
                                    Y: =16
                                  Children:
                                    - conSkeletonTitle:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          Fill: =nfThemeBorder
                                          Height: =12
                                          Width: =160
                                          X: =14
                                          Y: =14
                                    - conSkeletonDesc:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          Fill: =nfThemeSecondary
                                          Height: =10
                                          Width: =240
                                          X: =14
                                          Y: =34
                                    - conSkeletonMeta:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          Fill: =nfThemeBorder
                                          Height: =10
                                          Width: =140
                                          X: =14
                                          Y: =62
                  - galTimeline:
                      Control: Gallery@2.15.0
                      Variant: VariableHeight
                      Properties:
                        DelayItemLoading: =false
                        Height: =Parent.Height
                        Items: |-
                          =If(
                            IsBlank(_auditFilter) || _auditFilter = "All Activities",
                            cmpActivityTimeline.Items,
                            Filter(cmpActivityTimeline.Items, ActivityType = _auditFilter)
                          )
                        LayoutMinHeight: =0
                        ShowScrollbar: =cmpActivityTimeline.ShowScrollbar
                        TemplatePadding: =0
                        TemplateSize: =conCard.Height+(nfPagePadding*2)
                        Visible: =!cmpActivityTimeline.IsLoading
                        Width: =Parent.Width
                      Children:
                        - conCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =nfThemeBorder
                              BorderThickness: =1
                              DropShadow: =DropShadow.Semilight
                              Fill: =nfThemeSurface
                              Height: =If(ThisItem.ActivityType = "Email", conCardHeader.Height+htmSubDetail.Height+(nfPagePadding), conCardHeader.Height+nfPagePadding)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              PaddingBottom: =12
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.Width - Self.X-nfPagePadding
                              X: =52
                              Y: =nfPagePadding/2
                            Children:
                              - conCardHeader:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMaxHeight: =conTitleBlock.Height+lblEventDesc.Height
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    X: =40
                                    Y: =40
                                  Children:
                                    - conTitleBlock:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =nfInputHeight
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMaxHeight: =If(ThisItem.ActivityType = "Email",conCardHeader.Height+htmSubDetail.Height,conCardHeader.Height)
                                          LayoutMinHeight: =nfInputHeight
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - lblEventTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =nfThemeText
                                                FillPortions: =1
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                Height: =20
                                                LayoutMaxHeight: =Parent.Height
                                                LayoutMaxWidth: =Parent.Width/4
                                                LayoutMinHeight: =20
                                                LayoutMinWidth: =0
                                                Size: =nfFontSizeCardTitle
                                                Text: =$"New {ThisItem.ActivityType}"
                                          - lblAuthorDate:
                                              Control: Label@2.5.1
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =nfThemeMutedText
                                                FillPortions: =1
                                                Font: =Font.'Segoe UI'
                                                Height: =16
                                                LayoutMaxWidth: =300
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =100
                                                Size: =nfFontSizeBody
                                                Text: ="by " & ThisItem.'Created By'.DisplayName
                                                Wrap: =false
                                          - btnOriginator:
                                              Control: Classic/Button@2.2.0
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                BorderStyle: =BorderStyle.None
                                                Color: |-
                                                  =Switch(
                                                      Self.Text,
                                                      "Requester",
                                                      RGBA(0, 120, 212, 1),

                                                      "Requested For",
                                                      RGBA(0, 120, 212, 1),

                                                      gblSelectedRequest.AssignedTeam,
                                                      RGBA(255, 144, 0, 1),

                                                      "Automation",
                                                      RGBA(96, 94, 92, 1),

                                                      RGBA(96, 94, 92, 1)
                                                  )
                                                DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                DisabledColor: =RGBA(161, 159, 157, 1)
                                                DisabledFill: =RGBA(242, 242, 241, 0)
                                                Fill: |-
                                                  =Switch(
                                                      Self.Text,
                                                      "Requester",
                                                      RGBA(0, 120, 212, 0.12),

                                                      "Requested For",
                                                      RGBA(0, 120, 212, 0.12),

                                                      gblSelectedRequest.AssignedTeam,
                                                      RGBA(255, 144, 0, 0.2),

                                                      "Automation",
                                                      RGBA(96, 94, 92, 0.2),

                                                      RGBA(96, 94, 92, 0.2)
                                                  )
                                                Font: =Font.'Segoe UI'
                                                Height: =Parent.Height
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                HoverColor: =RGBA(255, 255, 255, 1)
                                                HoverFill: =RGBA(16, 110, 190, 1)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PressedBorderColor: =RGBA(0, 69, 120, 1)
                                                PressedColor: =RGBA(255, 255, 255, 1)
                                                PressedFill: =RGBA(16, 110, 190, 1)
                                                RadiusBottomLeft: =nfControlRadius
                                                RadiusBottomRight: =nfControlRadius
                                                RadiusTopLeft: =nfControlRadius
                                                RadiusTopRight: =nfControlRadius
                                                Size: =nfFontSizeSmall
                                                Text: =Switch(true,ThisItem.'Created By'.Email = gblSelectedRequest.RequestedForEmail, "Requested For",ThisItem.'Created By'.Email = gblSelectedRequest.'Created By'.Email,"Requester",ThisItem.'Created By'.Email = gblSelectedRequest.AssignedToEmail, gblSelectedRequest.AssignedTeam,LookUp(nfActivityTypes,ActivityType=ThisItem.ActivityType,IsSystem),"Automation")
                                                Width: =120
                                          - conSpacer2:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                BorderStyle: =BorderStyle.None
                                                DropShadow: =DropShadow.None
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =Parent.Width/5
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                          - lblActivityCreatedDate:
                                              Control: Label@2.5.1
                                              Properties:
                                                Align: =Align.Center
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =nfThemeMutedText
                                                Font: =Font.'Segoe UI'
                                                Height: =16
                                                LayoutMinHeight: =0
                                                Size: =nfFontSizeBody
                                                Text: =ThisItem.Created
                                                Wrap: =false
                                          - htmlInternalIcon:
                                              Control: HtmlViewer@2.1.0
                                              Properties:
                                                DisabledBorderColor: =RGBA(161, 159, 157, 1)
                                                Font: =Font.'Segoe UI'
                                                Height: =Parent.Height
                                                HtmlText: =fnIconHtml("Internal",nfThemeMutedText,Min(Self.Height,Self.Width)-4)
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Visible: =ThisItem.IsInternal
                                                Width: =Self.Height*2
                                    - lblEventDesc:
                                        Control: Label@2.5.1
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          AutoHeight: =true
                                          Color: =nfThemeText
                                          Font: =Font.'Segoe UI'
                                          Height: =20
                                          LayoutMinHeight: =nfInputHeight
                                          Size: =nfFontSizeBody
                                          Text: =ThisItem.ActivityText
                                          VerticalAlign: =VerticalAlign.Top
                                          Wrap: =false
                              - htmSubDetail:
                                  Control: HtmlViewer@2.1.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Height: =
                                    HtmlText: =ThisItem.Html
                                    LayoutMaxHeight: =180
                                    LayoutMinHeight: =100
                                    Visible: =ThisItem.ActivityType = "Email"
                        - btnCardOverlay_3:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              Height: =If(ThisItem.ActivityType = "Email", cmpActivityTimeline.SubDetailCardHeight, cmpActivityTimeline.CardHeight)
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0.02)
                              OnSelect: |-
                                =Set(_auditSelectedItem, ThisItem);
                                cmpActivityTimeline.OnItemSelect()
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0.05)
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Text: =""
                              Visible: =false
                              Width: =Parent.Width - 92
                              X: =76
                              Y: =16
                        - conTimelineLeft:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Height: =conCard.Height+nfPagePadding
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =52
                              X: =16
                            Children:
                              - shpLine:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    Fill: =nfThemeSecondary
                                    Height: =Parent.Height
                                    Width: =2
                                    X: =24
                              - conDot:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =ColorFade(Self.Fill,-20%)
                                    BorderThickness: =2
                                    Fill: |-
                                      =Coalesce(
                                          LookUp(
                                              nfActivityTypes,
                                              ActivityType = ThisItem.ActivityType,
                                              Colour
                                          ),
                                          nfThemeMutedText
                                      )
                                    Height: =36
                                    RadiusBottomLeft: =18
                                    RadiusBottomRight: =18
                                    RadiusTopLeft: =18
                                    RadiusTopRight: =18
                                    Width: =36
                                    X: =8
                                    Y: =nfPagePadding
                                  Children:
                                    - htmlActivityIcon:
                                        Control: HtmlViewer@2.1.0
                                        Properties:
                                          DisabledBorderColor: =RGBA(161, 159, 157, 1)
                                          Font: =Font.'Segoe UI'
                                          Height: =Self.Width
                                          HtmlText: =fnIconHtml(ThisItem.ActivityType,Color.White,Min(Self.Height,Self.Width) -4 )
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Width: =Parent.Width*0.7
                                          X: =(Parent.Width - Self.Width)/2
                                          Y: =(Parent.Height - Self.Height) / 2
