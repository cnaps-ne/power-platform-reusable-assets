# Paste inside the new component after adding its custom properties.
- cmpHeaderCommandSurface:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: |-
        =0
      Y: |-
        =0
      Width: |-
        =Parent.Width
      Height: |-
        =Parent.Height
      Fill: |-
        =nfThemeSurface
      BorderColor: |-
        =nfThemeBorder
      BorderThickness: |-
        =1
      DropShadow: |-
        =DropShadow.None
      RadiusTopLeft: |-
        =0
      RadiusTopRight: |-
        =0
      RadiusBottomLeft: |-
        =0
      RadiusBottomRight: |-
        =0
    Children:
      - cmpHeaderCommandAccent:
          Control: Rectangle@2.3.0
          Properties:
            X: |-
              =0
            Y: |-
              =0
            Width: |-
              =4
            Height: |-
              =Parent.Height
            Fill: |-
              =nfThemePrimary
            BorderThickness: |-
              =0
      - cmpHeaderCommandProduct:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =nfAppTitle
            X: |-
              =20
            Y: |-
              =14
            Width: |-
              =150
            Height: |-
              =18
            Size: |-
              =9
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Normal
            Color: |-
              =nfThemeMutedText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
      - cmpHeaderCommandTitle:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =cmpHeaderCommand.PageTitle
            X: |-
              =20
            Y: |-
              =31
            Width: |-
              =Parent.Width-430
            Height: |-
              =29
            Size: |-
              =18
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Color: |-
              =nfThemeText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
      - cmpHeaderCommandQueue:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              ="Queue"
            OnSelect: |-
              =cmpHeaderCommand.OnQueueSelect()
            X: |-
              =Parent.Width-370
            Y: |-
              =17
            Width: |-
              =124
            Height: |-
              =38
            Size: |-
              =11
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Fill: |-
              =nfThemeSurface
            Color: |-
              =nfThemeText
            BorderColor: |-
              =nfThemeBorder
            BorderThickness: |-
              =1
            HoverFill: |-
              =ColorFade(nfThemeSurface,If(gblDarkMode,12%,-5%))
            HoverColor: |-
              =nfThemeText
            PressedFill: |-
              =ColorFade(nfThemePrimary,-10%)
            PressedColor: |-
              =ColorValue("#241600")
            FocusedBorderThickness: |-
              =3
            RadiusTopLeft: |-
              =12
            RadiusTopRight: |-
              =12
            RadiusBottomLeft: |-
              =12
            RadiusBottomRight: |-
              =12
      - cmpHeaderCommandModeIcon:
          Control: HtmlViewer@2.1.0
          Properties:
            X: |-
              =Parent.Width-205
            Y: |-
              =22
            Width: |-
              =26
            Height: |-
              =26
            HtmlText: |-
              =fnIconHtml(Coalesce(LookUp(nfIconLibrary,Name=If(gblDarkMode,"LightMode","DarkMode"),Name),"General"),nfThemeText,22)
            Font: |-
              =Font.'Segoe UI'
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
      - cmpHeaderCommandToggle:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =""
            OnSelect: |-
              =Set(gblDarkMode,!gblDarkMode)
            X: |-
              =Parent.Width-213
            Y: |-
              =16
            Width: |-
              =42
            Height: |-
              =42
            Size: |-
              =11
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Fill: |-
              =Color.Transparent
            Color: |-
              =nfThemeText
            BorderColor: |-
              =Color.Transparent
            BorderThickness: |-
              =1
            HoverFill: |-
              =nfThemeHover
            HoverColor: |-
              =nfThemeText
            PressedFill: |-
              =ColorFade(nfThemePrimary,-10%)
            PressedColor: |-
              =ColorValue("#241600")
            FocusedBorderThickness: |-
              =3
            RadiusTopLeft: |-
              =12
            RadiusTopRight: |-
              =12
            RadiusBottomLeft: |-
              =12
            RadiusBottomRight: |-
              =12
            Tooltip: |-
              ="Toggle light or dark mode"
      - cmpHeaderCommandAvatar:
          Control: Image@2.2.3
          Properties:
            Image: |-
              =User().Image
            ImagePosition: |-
              =ImagePosition.Fill
            AccessibleLabel: |-
              =User().FullName
            X: |-
              =Parent.Width-143
            Y: |-
              =19
            Width: |-
              =34
            Height: |-
              =34
            RadiusTopLeft: |-
              =100
            RadiusTopRight: |-
              =100
            RadiusBottomLeft: |-
              =100
            RadiusBottomRight: |-
              =100
            BorderColor: |-
              =nfThemeBorder
            BorderThickness: |-
              =1
      - cmpHeaderCommandPerson:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =User().FullName
            X: |-
              =Parent.Width-99
            Y: |-
              =19
            Width: |-
              =91
            Height: |-
              =34
            Size: |-
              =10
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Color: |-
              =nfThemeText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
      - cmpHeaderCommandDivider:
          Control: Rectangle@2.3.0
          Properties:
            X: |-
              =0
            Y: |-
              =Parent.Height-1
            Width: |-
              =Parent.Width
            Height: |-
              =1
            Fill: |-
              =nfThemeBorder
            BorderThickness: |-
              =0
