# Paste inside the new component after adding its custom properties.
- cmpEmptyStateBox:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: |-
        =0
      Y: |-
        =0
      Width: |-
        =Parent.Width
      Height: |-
        =Parent.Height
      Fill: |-
        =nfThemeSurface
      BorderColor: |-
        =nfThemeBorder
      BorderThickness: |-
        =1
      DropShadow: |-
        =DropShadow.None
      RadiusTopLeft: |-
        =18
      RadiusTopRight: |-
        =18
      RadiusBottomLeft: |-
        =18
      RadiusBottomRight: |-
        =18
    Children:
      - cmpEmptyStateIcon:
          Control: HtmlViewer@2.1.0
          Properties:
            X: |-
              =22
            Y: |-
              =24
            Width: |-
              =36
            Height: |-
              =36
            HtmlText: |-
              =fnIconHtml(Coalesce(LookUp(nfIconLibrary,Name=cmpEmptyState.IconName,Name),"General"),nfThemePrimary,32)
            Font: |-
              =Font.'Segoe UI'
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
      - cmpEmptyStateTitle:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =cmpEmptyState.TitleText
            X: |-
              =78
            Y: |-
              =22
            Width: |-
              =Parent.Width-100
            Height: |-
              =31
            Size: |-
              =17
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Color: |-
              =nfThemeText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
      - cmpEmptyStateBody:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =cmpEmptyState.BodyText
            X: |-
              =78
            Y: |-
              =66
            Width: |-
              =Parent.Width-100
            Height: |-
              =65
            Size: |-
              =12
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Normal
            Color: |-
              =nfThemeMutedText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
