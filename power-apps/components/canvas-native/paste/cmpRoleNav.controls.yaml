# Paste inside the new component after adding its custom properties.
- cmpRoleNavBox:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: |-
        =0
      Y: |-
        =0
      Width: |-
        =Parent.Width
      Height: |-
        =Parent.Height
      Fill: |-
        =nfThemeSurface
      BorderColor: |-
        =nfThemeBorder
      BorderThickness: |-
        =1
      DropShadow: |-
        =DropShadow.None
      RadiusTopLeft: |-
        =0
      RadiusTopRight: |-
        =0
      RadiusBottomLeft: |-
        =0
      RadiusBottomRight: |-
        =0
    Children:
      - cmpRoleNavBrand:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =nfAppTitle
            X: |-
              =18
            Y: |-
              =22
            Width: |-
              =Parent.Width-36
            Height: |-
              =48
            Size: |-
              =23
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Color: |-
              =nfThemeText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
      - cmpRoleNavMenu:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =SortByColumns(Filter(cmpRoleNav.Menu,MinRoleRank<=cmpRoleNav.RoleRank),"SortOrder",SortOrder.Ascending)
            X: |-
              =10
            Y: |-
              =102
            Width: |-
              =Parent.Width-20
            Height: |-
              =Parent.Height-128
            TemplateSize: |-
              =48
            TemplatePadding: |-
              =8
            WrapCount: |-
              =1
            ShowScrollbar: |-
              =true
            DelayItemLoading: |-
              =true
            OnSelect: |-
              =false
          Children:
            - cmpRoleNavSection:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =ThisItem.Title
                  X: |-
                    =12
                  Y: |-
                    =9
                  Width: |-
                    =Parent.TemplateWidth-24
                  Height: |-
                    =30
                  Size: |-
                    =9
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Color: |-
                    =nfThemeMutedText
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Wrap: |-
                    =true
                  Visible: |-
                    =ThisItem.IsSection
            - cmpRoleNavNavigate:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Title
                  OnSelect: |-
                    =If(!ThisItem.IsSection,Navigate(ThisItem.Screen,ScreenTransition.Fade))
                  X: |-
                    =6
                  Y: |-
                    =3
                  Width: |-
                    =Parent.TemplateWidth-12
                  Height: |-
                    =42
                  Size: |-
                    =11
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Fill: |-
                    =nfThemeSurface
                  Color: |-
                    =nfThemeText
                  BorderColor: |-
                    =nfThemeBorder
                  BorderThickness: |-
                    =1
                  HoverFill: |-
                    =ColorFade(nfThemeSurface,If(gblDarkMode,12%,-5%))
                  HoverColor: |-
                    =nfThemeText
                  PressedFill: |-
                    =ColorFade(nfThemePrimary,-10%)
                  PressedColor: |-
                    =ColorValue("#241600")
                  FocusedBorderThickness: |-
                    =3
                  RadiusTopLeft: |-
                    =12
                  RadiusTopRight: |-
                    =12
                  RadiusBottomLeft: |-
                    =12
                  RadiusBottomRight: |-
                    =12
                  Visible: |-
                    =!ThisItem.IsSection
