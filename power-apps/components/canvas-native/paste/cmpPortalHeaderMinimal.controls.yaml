# Paste inside the new component after adding its custom properties.
- cmpPortalHeaderMinimalSurface:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: |-
        =0
      Y: |-
        =0
      Width: |-
        =Parent.Width
      Height: |-
        =Parent.Height
      Fill: |-
        =nfThemeSurface
      BorderColor: |-
        =nfThemeBorder
      BorderThickness: |-
        =1
      DropShadow: |-
        =DropShadow.None
      RadiusTopLeft: |-
        =0
      RadiusTopRight: |-
        =0
      RadiusBottomLeft: |-
        =0
      RadiusBottomRight: |-
        =0
    Children:
      - cmpPortalHeaderMinimalBrand:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =nfAppTitle
            X: |-
              =22
            Y: |-
              =16
            Width: |-
              =164
            Height: |-
              =42
            Size: |-
              =20
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Color: |-
              =nfThemePrimary
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
            Visible: |-
              =IsBlank(cmpPortalHeaderMinimal.Logo)
      - cmpPortalHeaderMinimalLogo:
          Control: Image@2.2.3
          Properties:
            Image: |-
              =cmpPortalHeaderMinimal.Logo
            ImagePosition: |-
              =ImagePosition.Fill
            AccessibleLabel: |-
              ="Application logo"
            X: |-
              =20
            Y: |-
              =12
            Width: |-
              =154
            Height: |-
              =48
      - cmpPortalHeaderMinimalTabs:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Items: |-
              =SortByColumns(Filter(cmpPortalHeaderMinimal.Menu,Group="User Portal" && !IsSection && MinRoleRank<=1),"SortOrder",SortOrder.Ascending)
            X: |-
              =196
            Y: |-
              =4
            Width: |-
              =Max(260,Parent.Width-415)
            Height: |-
              =64
            TemplateSize: |-
              =Max(126,Self.Width/Max(CountRows(Filter(cmpPortalHeaderMinimal.Menu,Group="User Portal" && !IsSection && MinRoleRank<=1)),1))
            TemplatePadding: |-
              =8
            WrapCount: |-
              =1
            ShowScrollbar: |-
              =true
            DelayItemLoading: |-
              =true
            OnSelect: |-
              =false
          Children:
            - cmpPortalHeaderMinimalTab:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =ThisItem.Title
                  OnSelect: |-
                    =Navigate(ThisItem.Screen,ScreenTransition.Fade)
                  X: |-
                    =8
                  Y: |-
                    =8
                  Width: |-
                    =Parent.TemplateWidth-16
                  Height: |-
                    =48
                  Size: |-
                    =11
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Fill: |-
                    =If(ThisItem.Screen=App.ActiveScreen || (App.ActiveScreen='Request Detail Screen' && ThisItem.Screen='My Requests Screen') || (App.ActiveScreen='New Request Screen' && ThisItem.Screen='Portal Home Screen'),If(gblDarkMode,ColorFade(nfThemePrimary,-80%),ColorFade(nfThemePrimary,80%)),Color.Transparent)
                  Color: |-
                    =If(ThisItem.Screen=App.ActiveScreen || (App.ActiveScreen='Request Detail Screen' && ThisItem.Screen='My Requests Screen') || (App.ActiveScreen='New Request Screen' && ThisItem.Screen='Portal Home Screen'),nfThemePrimary,nfThemeText)
                  BorderColor: |-
                    =Color.Transparent
                  BorderThickness: |-
                    =1
                  HoverFill: |-
                    =nfThemeHover
                  HoverColor: |-
                    =nfThemeText
                  PressedFill: |-
                    =ColorFade(nfThemePrimary,-10%)
                  PressedColor: |-
                    =ColorValue("#241600")
                  FocusedBorderThickness: |-
                    =3
                  RadiusTopLeft: |-
                    =12
                  RadiusTopRight: |-
                    =12
                  RadiusBottomLeft: |-
                    =12
                  RadiusBottomRight: |-
                    =12
                  Tooltip: |-
                    =ThisItem.Title
            - cmpPortalHeaderMinimalActiveLine:
                Control: Rectangle@2.3.0
                Properties:
                  X: |-
                    =18
                  Y: |-
                    =Parent.TemplateHeight-3
                  Width: |-
                    =Parent.TemplateWidth-36
                  Height: |-
                    =3
                  Fill: |-
                    =nfThemePrimary
                  BorderThickness: |-
                    =0
                  Visible: |-
                    =ThisItem.Screen=App.ActiveScreen || (App.ActiveScreen='Request Detail Screen' && ThisItem.Screen='My Requests Screen') || (App.ActiveScreen='New Request Screen' && ThisItem.Screen='Portal Home Screen')
      - cmpPortalHeaderMinimalBell:
          Control: HtmlViewer@2.1.0
          Properties:
            X: |-
              =Parent.Width-162
            Y: |-
              =22
            Width: |-
              =25
            Height: |-
              =25
            HtmlText: |-
              =fnIconHtml(Coalesce(LookUp(nfIconLibrary,Name="Notification",Name),"General"),nfThemeText,21)
            Font: |-
              =Font.'Segoe UI'
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
      - cmpPortalHeaderMinimalBadge:
          Control: Rectangle@2.3.0
          Properties:
            X: |-
              =Parent.Width-140
            Y: |-
              =13
            Width: |-
              =10
            Height: |-
              =10
            Fill: |-
              =nfThemePrimary
            BorderThickness: |-
              =0
            Visible: |-
              =cmpPortalHeaderMinimal.HasNotifications || cmpPortalHeaderMinimal.NotificationCount>0
      - cmpPortalHeaderMinimalCount:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(cmpPortalHeaderMinimal.NotificationCount>99,"99+",Text(cmpPortalHeaderMinimal.NotificationCount,"0"))
            X: |-
              =Parent.Width-139
            Y: |-
              =7
            Width: |-
              =29
            Height: |-
              =17
            Size: |-
              =8
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Color: |-
              =nfThemeText
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
            Wrap: |-
              =true
            Visible: |-
              =cmpPortalHeaderMinimal.NotificationCount>0
      - cmpPortalHeaderMinimalNotifications:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =""
            OnSelect: |-
              =cmpPortalHeaderMinimal.OnNotificationSelect()
            X: |-
              =Parent.Width-174
            Y: |-
              =14
            Width: |-
              =44
            Height: |-
              =44
            Size: |-
              =11
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Fill: |-
              =Color.Transparent
            Color: |-
              =nfThemeText
            BorderColor: |-
              =Color.Transparent
            BorderThickness: |-
              =1
            HoverFill: |-
              =nfThemeHover
            HoverColor: |-
              =nfThemeText
            PressedFill: |-
              =ColorFade(nfThemePrimary,-10%)
            PressedColor: |-
              =ColorValue("#241600")
            FocusedBorderThickness: |-
              =3
            RadiusTopLeft: |-
              =12
            RadiusTopRight: |-
              =12
            RadiusBottomLeft: |-
              =12
            RadiusBottomRight: |-
              =12
            Tooltip: |-
              ="Notifications"
      - cmpPortalHeaderMinimalModeIcon:
          Control: HtmlViewer@2.1.0
          Properties:
            X: |-
              =Parent.Width-108
            Y: |-
              =22
            Width: |-
              =25
            Height: |-
              =25
            HtmlText: |-
              =fnIconHtml(Coalesce(LookUp(nfIconLibrary,Name=If(gblDarkMode,"LightMode","DarkMode"),Name),"General"),nfThemeText,21)
            Font: |-
              =Font.'Segoe UI'
            PaddingLeft: |-
              =0
            PaddingRight: |-
              =0
            PaddingTop: |-
              =0
            PaddingBottom: |-
              =0
      - cmpPortalHeaderMinimalToggle:
          Control: Classic/Button@2.2.0
          Properties:
            Text: |-
              =""
            OnSelect: |-
              =Set(gblDarkMode,!gblDarkMode)
            X: |-
              =Parent.Width-120
            Y: |-
              =14
            Width: |-
              =46
            Height: |-
              =44
            Size: |-
              =11
            Font: |-
              =Font.'Segoe UI'
            FontWeight: |-
              =FontWeight.Semibold
            Fill: |-
              =Color.Transparent
            Color: |-
              =nfThemeText
            BorderColor: |-
              =Color.Transparent
            BorderThickness: |-
              =1
            HoverFill: |-
              =nfThemeHover
            HoverColor: |-
              =nfThemeText
            PressedFill: |-
              =ColorFade(nfThemePrimary,-10%)
            PressedColor: |-
              =ColorValue("#241600")
            FocusedBorderThickness: |-
              =3
            RadiusTopLeft: |-
              =12
            RadiusTopRight: |-
              =12
            RadiusBottomLeft: |-
              =12
            RadiusBottomRight: |-
              =12
            Tooltip: |-
              ="Toggle light or dark mode"
      - cmpPortalHeaderMinimalAvatar:
          Control: Image@2.2.3
          Properties:
            Image: |-
              =User().Image
            ImagePosition: |-
              =ImagePosition.Fill
            AccessibleLabel: |-
              =User().FullName
            X: |-
              =Parent.Width-58
            Y: |-
              =19
            Width: |-
              =34
            Height: |-
              =34
            RadiusTopLeft: |-
              =100
            RadiusTopRight: |-
              =100
            RadiusBottomLeft: |-
              =100
            RadiusBottomRight: |-
              =100
            BorderColor: |-
              =nfThemeBorder
            BorderThickness: |-
              =1
      - cmpPortalHeaderMinimalDivider:
          Control: Rectangle@2.3.0
          Properties:
            X: |-
              =0
            Y: |-
              =Parent.Height-1
            Width: |-
              =Parent.Width
            Height: |-
              =1
            Fill: |-
              =nfThemeBorder
            BorderThickness: |-
              =0
