ComponentDefinitions:
  cmpHeader:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      PageTitle:
        PropertyKind: Input
        DisplayName: Page Title
        Description: A custom property
        DataType: Text
        Default: =Substitute(App.ActiveScreen.Name," Screen","")
    Properties:
      Height: =nfHeaderHeight
      Width: =App.Width-nfNavWidth
    Children:
      - conHeader:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =nfThemeBackground
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - htmlHeaderBackground:
                Control: HtmlViewer@2.1.0
                Properties:
                  DisabledBorderColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  Height: =Parent.Height+1
                  HtmlText: |-
                    =Substitute(
                        With({PrimaryColour:Left(JSON(nfThemePrimary),8),SurfaceColour:Left(JSON(nfSurfaceColour),8),BackgroundColour:Left(JSON(nfBackgroundColour),8)},
                    $"<div style='
                            position:absolute;
                            inset:0;
                            width:100%;
                            height:100%;
                            min-height:100%;
                            overflow:hidden;
                            background:
                            linear-gradient(0deg, {PrimaryColour}BB 4%, {PrimaryColour}88 5%, transparent 15%);
                        '></div>"),"""","")
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Width: =Parent.Width
            - conDarkModeToggle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height-(Self.Y*2)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Self.Height
                  X: =conProfile.X-Self.Width-nfPagePadding
                  Y: =10
                Children:
                  - htmlDarkMode:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        DisabledBorderColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        Height: =Self.Width
                        HtmlText: =fnIconHtml(If(gblDarkMode,"LightMode","DarkMode"),nfThemeText,Min(Self.Width, Self.Height) - 4)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width-(nfPagePadding/2)
                        X: =Parent.Width/2-Self.Width/2
                        Y: =Parent.Height/2-Self.Height/2
                  - btnToggleDarkMode:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        DisabledFill: =RGBA(242, 242, 241, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: |+
                          =2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height-4
                        HoverBorderColor: =nfThemeBorder
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =
                        OnSelect: =Set(gblDarkMode,!gblDarkMode)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =nfThemePrimary
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =100
                        RadiusBottomRight: =100
                        RadiusTopLeft: =100
                        RadiusTopRight: =100
                        Text: =
                        Width: =Parent.Width-4
                        X: =Parent.Width/2-Self.Width/2
                        Y: =Parent.Height/2-Self.Height/2
            - conProfile:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.Regular
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =250
                  X: =Parent.Width-Self.Width
                Children:
                  - imgUser:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =nfThemeBorder
                        BorderThickness: =2
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        FocusedBorderThickness: =4
                        Height: =Parent.Height-(nfPagePadding)
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        Image: =User().Image
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =100
                        RadiusBottomRight: =100
                        RadiusTopLeft: =100
                        RadiusTopRight: =100
                        Width: =Self.Height
                        X: =10
                        Y: =Parent.Height/2-Self.Height/2
                  - lblUser:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =nfThemeText
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =nfAppFont
                        FontWeight: =FontWeight.Semibold
                        Height: =imgUser.Height/2
                        PaddingBottom: =0
                        PaddingLeft: =10
                        Size: =nfFontSizeSmall
                        Text: =User().FullName
                        Width: =Parent.Width-Self.X
                        X: =imgUser.X+imgUser.Width
                        Y: =imgUser.Y
                  - lblRole:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        Color: =nfThemeMutedText
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =nfAppFont
                        Height: =imgUser.Height/2
                        PaddingLeft: =10
                        PaddingTop: =0
                        Size: =nfFontSizeTiny
                        Text: =If(gblIsAdmin,"System Administrator","Basic User")
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width-Self.X
                        X: =imgUser.X+imgUser.Width
                        Y: =lblUser.Y+lblUser.Height
            - recHeaderBorder:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledFill: =RGBA(161, 159, 157, 1)
                  Fill: =nfThemeBorder
                  FocusedBorderThickness: =4
                  Height: =1
                  HoverFill: =RGBA(0, 120, 212, 1)
                  PressedFill: =RGBA(0, 120, 212, 1)
                  Width: =Parent.Width
                  Y: =Parent.Height-Self.Height
            - Label1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =nfAppFont
                  PaddingLeft: =15
                  Size: =9
                  Text: |-
                    =$"App Width: {App.Width} | App Height: {App.Height} | App Design Width: {App.DesignWidth} | App Design Height: {App.DesignHeight}"
                  Visible: =false
                  Width: =515
                  X: =284
                  Y: =16
            - lblPageHeader:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  Color: =nfThemeText
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  FocusedBorderThickness: =4
                  Font: =nfAppFont
                  Height: =72
                  PaddingLeft: =20
                  Size: =nfFontSizeCardTitle
                  Text: =cmpHeader.PageTitle
                  Width: =284
