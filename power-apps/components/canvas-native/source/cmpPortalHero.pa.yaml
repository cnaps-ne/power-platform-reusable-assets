# Canvas component source. Review and test in Power Apps Studio before production use.
ComponentDefinitions:
  cmpPortalHero:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      HeadingText:
        PropertyKind: Input
        DisplayName: HeadingText
        Description: Hero heading.
        DataType: Text
        Default: |-
          ="Great work starts here."
      SubtitleText:
        PropertyKind: Input
        DisplayName: SubtitleText
        Description: Supporting line.
        DataType: Text
        Default: |-
          ="Find a service. Get support. Keep things moving."
      SearchText:
        PropertyKind: Output
        DisplayName: SearchText
        Description: Current SearchText
        DataType: Text
    Properties:
      Width: |-
        =900
      Height: |-
        =248
      SearchText: |-
        =txtcmpPortalHeroSearch.Text
    Children:
      - cmpPortalHeroBox:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: |-
              =0
            Y: |-
              =0
            Width: |-
              =Parent.Width
            Height: |-
              =Parent.Height
            Fill: |-
              =nfThemeSurface
            BorderColor: |-
              =nfThemeBorder
            BorderThickness: |-
              =1
            DropShadow: |-
              =DropShadow.None
            RadiusTopLeft: |-
              =22
            RadiusTopRight: |-
              =22
            RadiusBottomLeft: |-
              =22
            RadiusBottomRight: |-
              =22
          Children:
            - cmpPortalHeroGlow:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =With(
                        {p: nfThemePrimaryText,
                         s: nfThemeSurfaceText,
                         b: Substitute(JSON(nfThemeBorder), """", "")},
                        "<div style='position:relative;box-sizing:border-box;width:100%;height:" &
                        Text(Self.Height-2,"0","en-US") & "px;overflow:hidden;border-radius:22px;background:" &
                        "radial-gradient(ellipse at 87% 52%, " & p & If(gblDarkMode,"66","32") & " 0%, transparent 48%), " & "radial-gradient(ellipse at 65% 2%, " & p & If(gblDarkMode,"24","10") & " 0%, transparent 55%), " & s & ";border:1px solid " & b & ";'>" &
                        "<div style='position:absolute;width:280px;height:280px;border-radius:50%;right:30px;top:-80px;border:1px solid " &
                        p & "40;box-shadow:0 0 0 38px " & p & "0A,0 0 0 76px " & p & "06;'></div></div>"
                    )
                  Width: |-
                    =Parent.Width
                  Height: |-
                    =Parent.Height
                  X: |-
                    =0
                  Y: |-
                    =0
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Font: |-
                    =Font.'Segoe UI'
            - cmpPortalHeroTitle:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =cmpPortalHero.HeadingText
                  X: |-
                    =30
                  Y: |-
                    =34
                  Width: |-
                    =Parent.Width-60
                  Height: |-
                    =54
                  Size: |-
                    =30
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Color: |-
                    =nfThemeText
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Wrap: |-
                    =true
            - cmpPortalHeroSubtitle:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =cmpPortalHero.SubtitleText
                  X: |-
                    =30
                  Y: |-
                    =105
                  Width: |-
                    =Parent.Width-60
                  Height: |-
                    =40
                  Size: |-
                    =13
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Normal
                  Color: |-
                    =nfThemeMutedText
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Wrap: |-
                    =true
            - txtcmpPortalHeroSearch:
                Control: Classic/TextInput@2.3.2
                Properties:
                  Default: |-
                    =""
                  HintText: |-
                    ="Search services"
                  X: |-
                    =30
                  Y: |-
                    =167
                  Width: |-
                    =Parent.Width-60
                  Height: |-
                    =49
                  Size: |-
                    =11
                  Font: |-
                    =Font.'Segoe UI'
                  Color: |-
                    =nfThemeText
                  Fill: |-
                    =nfThemeSurface
                  BorderColor: |-
                    =nfThemeBorder
                  BorderThickness: |-
                    =1
                  HoverBorderColor: |-
                    =nfThemePrimary
                  FocusedBorderThickness: |-
                    =2
                  PaddingLeft: |-
                    =14
                  RadiusTopLeft: |-
                    =12
                  RadiusTopRight: |-
                    =12
                  RadiusBottomLeft: |-
                    =12
                  RadiusBottomRight: |-
                    =12
