# Canvas component source. Review and test in Power Apps Studio before production use.
ComponentDefinitions:
  cmpPriorityPill:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      PriorityValue:
        PropertyKind: Input
        DisplayName: PriorityValue
        Description: One of nfPriorities.Priority.
        DataType: Text
        Default: |-
          ="Normal"
    Properties:
      Width: |-
        =130
      Height: |-
        =38
    Children:
      - cmpPriorityPillBox:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: |-
              =0
            Y: |-
              =0
            Width: |-
              =Parent.Width
            Height: |-
              =Parent.Height
            Fill: |-
              =If(gblDarkMode,nfThemeSurface,Coalesce(LookUp(nfPriorities,Priority=cmpPriorityPill.PriorityValue,FillColour),nfThemeSurface))
            BorderColor: |-
              =nfThemeBorder
            BorderThickness: |-
              =1
            DropShadow: |-
              =DropShadow.None
            RadiusTopLeft: |-
              =18
            RadiusTopRight: |-
              =18
            RadiusBottomLeft: |-
              =18
            RadiusBottomRight: |-
              =18
          Children:
            - cmpPriorityPillText:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =cmpPriorityPill.PriorityValue
                  X: |-
                    =10
                  Y: |-
                    =4
                  Width: |-
                    =Parent.Width-20
                  Height: |-
                    =Parent.Height-8
                  Size: |-
                    =10
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Color: |-
                    =If(gblDarkMode,nfThemeText,Coalesce(LookUp(nfPriorities,Priority=cmpPriorityPill.PriorityValue,TextColour),nfThemeText))
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Wrap: |-
                    =true
                  Align: |-
                    =Align.Center
