# Canvas component source. Review and test in Power Apps Studio before production use.
ComponentDefinitions:
  cmpHeaderGlow:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      PageTitle:
        PropertyKind: Input
        DisplayName: PageTitle
        Description: Same PageTitle input and default as cmpHeader.
        DataType: Text
        Default: |-
          =Substitute(App.ActiveScreen.Name," Screen","")
      OnQueueSelect:
        PropertyKind: Event
        DisplayName: On Queue Select
        Description: Fires when the queue shortcut is selected.
        ReturnType: None
        Default: =false
    Properties:
      Width: |-
        =App.Width-nfNavWidth
      Height: |-
        =nfHeaderHeight
    Children:
      - cmpHeaderGlowSurface:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            X: |-
              =0
            Y: |-
              =0
            Width: |-
              =Parent.Width
            Height: |-
              =Parent.Height
            Fill: |-
              =nfThemeSurface
            BorderColor: |-
              =nfThemeBorder
            BorderThickness: |-
              =1
            DropShadow: |-
              =DropShadow.None
            RadiusTopLeft: |-
              =0
            RadiusTopRight: |-
              =0
            RadiusBottomLeft: |-
              =0
            RadiusBottomRight: |-
              =0
          Children:
            - cmpHeaderGlowBackground:
                Control: HtmlViewer@2.1.0
                Properties:
                  HtmlText: |-
                    =With(
                        {p: nfThemePrimaryText,
                         s: nfThemeSurfaceText,
                         b: Substitute(JSON(nfThemeBorder), """", "")},
                        "<div style='position:relative;box-sizing:border-box;width:100%;height:" &
                        Text(Self.Height-2,"0","en-US") & "px;overflow:hidden;border-radius:22px;background:" &
                        "radial-gradient(ellipse at 87% 52%, " & p & If(gblDarkMode,"66","32") & " 0%, transparent 48%), " & "radial-gradient(ellipse at 65% 2%, " & p & If(gblDarkMode,"24","10") & " 0%, transparent 55%), " & s & ";border:1px solid " & b & ";'>" &
                        "<div style='position:absolute;width:280px;height:280px;border-radius:50%;right:30px;top:-80px;border:1px solid " &
                        p & "40;box-shadow:0 0 0 38px " & p & "0A,0 0 0 76px " & p & "06;'></div></div>"
                    )
                  Width: |-
                    =Parent.Width
                  Height: |-
                    =Parent.Height
                  X: |-
                    =0
                  Y: |-
                    =0
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Font: |-
                    =Font.'Segoe UI'
            - cmpHeaderGlowEyebrow:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="SERVICE HUB  /  WORKSPACE"
                  X: |-
                    =24
                  Y: |-
                    =9
                  Width: |-
                    =Parent.Width-390
                  Height: |-
                    =18
                  Size: |-
                    =8
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Color: |-
                    =nfThemeMutedText
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Wrap: |-
                    =true
            - cmpHeaderGlowTitle:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    =cmpHeaderGlow.PageTitle
                  X: |-
                    =24
                  Y: |-
                    =28
                  Width: |-
                    =Parent.Width-390
                  Height: |-
                    =35
                  Size: |-
                    =19
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Color: |-
                    =nfThemeText
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
                  Wrap: |-
                    =true
            - cmpHeaderGlowQueue:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    ="Open queue"
                  OnSelect: |-
                    =cmpHeaderGlow.OnQueueSelect()
                  X: |-
                    =Parent.Width-346
                  Y: |-
                    =17
                  Width: |-
                    =158
                  Height: |-
                    =38
                  Size: |-
                    =11
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Fill: |-
                    =nfThemeSurface
                  Color: |-
                    =nfThemeText
                  BorderColor: |-
                    =nfThemeBorder
                  BorderThickness: |-
                    =1
                  HoverFill: |-
                    =ColorFade(nfThemeSurface,If(gblDarkMode,12%,-5%))
                  HoverColor: |-
                    =nfThemeText
                  PressedFill: |-
                    =ColorFade(nfThemePrimary,-10%)
                  PressedColor: |-
                    =ColorValue("#241600")
                  FocusedBorderThickness: |-
                    =3
                  RadiusTopLeft: |-
                    =12
                  RadiusTopRight: |-
                    =12
                  RadiusBottomLeft: |-
                    =12
                  RadiusBottomRight: |-
                    =12
            - cmpHeaderGlowModeIcon:
                Control: HtmlViewer@2.1.0
                Properties:
                  X: |-
                    =Parent.Width-160
                  Y: |-
                    =22
                  Width: |-
                    =26
                  Height: |-
                    =26
                  HtmlText: |-
                    =fnIconHtml(Coalesce(LookUp(nfIconLibrary,Name=If(gblDarkMode,"LightMode","DarkMode"),Name),"General"),nfThemeText,22)
                  Font: |-
                    =Font.'Segoe UI'
                  PaddingLeft: |-
                    =0
                  PaddingRight: |-
                    =0
                  PaddingTop: |-
                    =0
                  PaddingBottom: |-
                    =0
            - cmpHeaderGlowToggle:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: |-
                    =""
                  OnSelect: |-
                    =Set(gblDarkMode,!gblDarkMode)
                  X: |-
                    =Parent.Width-168
                  Y: |-
                    =16
                  Width: |-
                    =42
                  Height: |-
                    =42
                  Size: |-
                    =11
                  Font: |-
                    =Font.'Segoe UI'
                  FontWeight: |-
                    =FontWeight.Semibold
                  Fill: |-
                    =Color.Transparent
                  Color: |-
                    =nfThemeText
                  BorderColor: |-
                    =Color.Transparent
                  BorderThickness: |-
                    =1
                  HoverFill: |-
                    =nfThemeHover
                  HoverColor: |-
                    =nfThemeText
                  PressedFill: |-
                    =ColorFade(nfThemePrimary,-10%)
                  PressedColor: |-
                    =ColorValue("#241600")
                  FocusedBorderThickness: |-
                    =3
                  RadiusTopLeft: |-
                    =12
                  RadiusTopRight: |-
                    =12
                  RadiusBottomLeft: |-
                    =12
                  RadiusBottomRight: |-
                    =12
                  Tooltip: |-
                    ="Toggle light or dark mode"
            - cmpHeaderGlowAvatar:
                Control: Image@2.2.3
                Properties:
                  Image: |-
                    =User().Image
                  ImagePosition: |-
                    =ImagePosition.Fill
                  AccessibleLabel: |-
                    =User().FullName
                  X: |-
                    =Parent.Width-100
                  Y: |-
                    =19
                  Width: |-
                    =34
                  Height: |-
                    =34
                  RadiusTopLeft: |-
                    =100
                  RadiusTopRight: |-
                    =100
                  RadiusBottomLeft: |-
                    =100
                  RadiusBottomRight: |-
                    =100
                  BorderColor: |-
                    =nfThemeBorder
                  BorderThickness: |-
                    =1
            - cmpHeaderGlowDivider:
                Control: Rectangle@2.3.0
                Properties:
                  X: |-
                    =0
                  Y: |-
                    =Parent.Height-1
                  Width: |-
                    =Parent.Width
                  Height: |-
                    =1
                  Fill: |-
                    =nfThemeBorder
                  BorderThickness: |-
                    =0
