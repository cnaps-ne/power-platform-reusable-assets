ComponentDefinitions:
  cmpStepper:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Active and complete highlight color
        DataType: Color
        Default: =nfThemePrimary
      CheckIcon:
        PropertyKind: Input
        DisplayName: CheckIcon
        Description: Optional SVG data URI to replace the default checkmark. Use currentColor as stroke/fill token.
        DataType: Text
        Default: =Blank()
      ClickableSteps:
        PropertyKind: Input
        DisplayName: ClickableSteps
        Description: Completed allows tapping done steps only. None disables all tapping. All allows jumping to any step.
        DataType: Text
        Default: ="None"
      CurrentStep:
        PropertyKind: Input
        DisplayName: CurrentStep
        Description: Active step index (1-based)
        DataType: Number
        Default: =2
      Density:
        PropertyKind: Input
        DisplayName: Density
        Description: Full shows circles with labels and connectors. Compact hides labels. Minimal hides labels and connectors. Only applies when Type is Step.
        DataType: Text
        Default: ="Full"
      OnStepSelect:
        PropertyKind: Event
        DisplayName: OnStepSelect
        Description: Fires when a step circle is tapped. Read SelectedStep inside handler.
        ReturnType: None
        Default: =false
      SelectedStep:
        PropertyKind: Output
        DisplayName: SelectedStep
        Description: Step index last tapped by the user
        DataType: Number
      Size:
        PropertyKind: Input
        DisplayName: Size
        Description: Small, Medium, or Large. Scales circle size, bar height, and component height.
        DataType: Text
        Default: ="Medium"
      StepLabels:
        PropertyKind: Input
        DisplayName: StepLabels
        Description: Table of {Label} rows, one per step. Count drives TotalSteps automatically.
        DataType: Table
        Default: |-
          =Table(
              {Label: "Job Info"},
              {Label: "Labor"},
              {Label: "Materials"},
              {Label: "Notes"},
              {Label: "Photos"},
              {Label: "Review"}
          )
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        Description: Light or Dark. Controls connector, future circle, and label colors.
        DataType: Text
        Default: ="Light"
      Type:
        PropertyKind: Input
        DisplayName: Type
        Description: Bar for thin progress bars, Step for numbered circles with labels
        DataType: Text
        Default: ="Step"
    Properties:
      Height: |-
        =If(
            cmpStepper.Type = "Bar",
            Switch(cmpStepper.Size, "Small", 4, "Medium", 6, "Large", 8, 6),
            If(
                cmpStepper.Density = "Full",
                Switch(cmpStepper.Size, "Small", 60, "Medium", 72, "Large", 86, 72),
                Switch(cmpStepper.Size, "Small", 26, "Medium", 32, "Large", 40, 32)
            )
        )
      SelectedStep: =If(IsBlank(_stepSel), 0, _stepSel)
      Width: =400
    Children:
      - galSimple:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height
            Items: =Sequence(CountRows(cmpStepper.StepLabels))
            OnSelect: =
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =Parent.Width / Max(CountRows(cmpStepper.StepLabels), 1)
            Visible: =cmpStepper.Type = "Bar"
            Width: =Parent.Width
          Children:
            - cntSimpleBar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        ThisItem.Value <= cmpStepper.CurrentStep,
                        cmpStepper.AccentColor,
                        If(cmpStepper.Theme = "Dark", RGBA(55, 65, 81, 1), RGBA(229, 231, 235, 1))
                    )
                  Height: =Parent.TemplateHeight
                  RadiusBottomLeft: =100
                  RadiusBottomRight: =100
                  RadiusTopLeft: =100
                  RadiusTopRight: =100
                  Width: =Parent.TemplateWidth - 6
                  X: =3
                Children:
                  - btnStepSelect_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =0
                        Color: =RGBA(0, 0, 0, 0)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        DisplayMode: |-
                          =Switch(
                              cmpStepper.ClickableSteps,
                              "None", DisplayMode.Disabled,
                              "All", If(
                                  ThisItem.Value = cmpStepper.CurrentStep,
                                  DisplayMode.Disabled,
                                  DisplayMode.Edit
                              ),
                              If(
                                  ThisItem.Value < cmpStepper.CurrentStep,
                                  DisplayMode.Edit,
                                  DisplayMode.Disabled
                              )
                          )
                        Fill: =RGBA(0, 0, 0, 0)
                        Height: =Parent.Height
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(0, 0, 0, 0)
                        HoverFill: =RGBA(0, 0, 0, 0.05)
                        OnSelect: |-
                          =Set(_stepSel, ThisItem.Value);
                          cmpStepper.OnStepSelect()
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(0, 0, 0, 0)
                        PressedFill: =RGBA(0, 0, 0, 0.08)
                        RadiusBottomLeft: =100
                        RadiusBottomRight: =100
                        RadiusTopLeft: =100
                        RadiusTopRight: =100
                        Text: =""
                        Width: =Parent.Width
      - galFull:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =Parent.Height
            Items: =Sequence(CountRows(cmpStepper.StepLabels))
            OnSelect: =
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =Parent.Width / Max(CountRows(cmpStepper.StepLabels), 1)
            Visible: =cmpStepper.Type = "Step"
            Width: =Parent.Width
          Children:
            - rctLineLeft:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.Value <= cmpStepper.CurrentStep,
                        cmpStepper.AccentColor,
                        If(cmpStepper.Theme = "Dark", RGBA(55, 65, 81, 1), RGBA(229, 231, 235, 1))
                    )
                  Height: =2
                  Visible: =ThisItem.Value > 1 && cmpStepper.Density <> "Minimal"
                  Width: =cntCircle.X
                  Y: =cntCircle.Y+((cntCircle.Height+Self.Height)/2)
            - rctLineRight:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.Value < cmpStepper.CurrentStep,
                        cmpStepper.AccentColor,
                        If(cmpStepper.Theme = "Dark", RGBA(55, 65, 81, 1), RGBA(229, 231, 235, 1))
                    )
                  Height: =2
                  Visible: =ThisItem.Value < CountRows(cmpStepper.StepLabels) && cmpStepper.Density <> "Minimal"
                  Width: =Parent.TemplateWidth - Self.X +1
                  X: =cntCircle.X+cntCircle.Width
                  Y: =cntCircle.Y+((cntCircle.Height+Self.Height)/2)
            - cntCircle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: |-
                    =If(
                        ThisItem.Value <= cmpStepper.CurrentStep,
                        cmpStepper.AccentColor,
                        If(cmpStepper.Theme = "Dark", RGBA(75, 85, 99, 1), RGBA(209, 213, 219, 1))
                    )
                  BorderThickness: =2
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        ThisItem.Value < cmpStepper.CurrentStep,
                        cmpStepper.AccentColor,
                        ThisItem.Value = cmpStepper.CurrentStep, ColorFade(cmpStepper.AccentColor,30%),
                        RGBA(0, 0, 0, 0)
                    )
                  Height: =Switch(cmpStepper.Size, "Small", nfFontSizePageTitle, "Medium", nfFontSizeHero, "Large", nfFontSizeHero+10, 18)
                  RadiusBottomLeft: =100
                  RadiusBottomRight: =100
                  RadiusTopLeft: =100
                  RadiusTopRight: =100
                  Width: =Switch(cmpStepper.Size, "Small", nfFontSizePageTitle, "Medium", nfFontSizeHero, "Large", nfFontSizeHero+10, 18)
                  X: =(Parent.TemplateWidth-Self.Width) / 2
                  Y: =Switch(cmpStepper.Size, "Small", If(cmpStepper.Density="Full",9,2), "Medium", If(cmpStepper.Density="Full",11,2), "Large", If(cmpStepper.Density="Full",14,3), If(cmpStepper.Density="Full",11,2))
                Children:
                  - htmlStepperIcon:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        DisabledBorderColor: =RGBA(161, 159, 157, 1)
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height*0.7
                        HtmlText: |-
                          =fnIconHtml(
                              If(
                                  ThisItem.Value = cmpStepper.CurrentStep,
                                  "Live",
                                  "Check"
                              ),
                              nfThemeBackground,
                              Min(
                                  Self.Width,
                                  Self.Height
                              ) - 4
                          )
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Visible: =ThisItem.Value <= cmpStepper.CurrentStep
                        Width: =Parent.Width*0.7
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) /2
            - lblStep:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: "=If(\n\n        ThisItem.Value <= cmpStepper.CurrentStep,\n        nfThemeText,\n        nfThemeMutedText\n    \n)"
                  FontWeight: |-
                    =If(
                        ThisItem.Value = cmpStepper.CurrentStep,
                        FontWeight.Bold,
                        ThisItem.Value < cmpStepper.CurrentStep,FontWeight.Semibold,
                        FontWeight.Normal
                    )
                  Height: =Switch(cmpStepper.Size, "Small", 16, "Medium", 18, "Large", 20, 18)
                  Size: =Switch(cmpStepper.Size, "Small", nfFontSizeTiny, "Medium", nfFontSizeBody, "Large", nfFontSizeCardTitle, nfFontSizeSmall)
                  Text: |-
                    =If(
                        CountRows(cmpStepper.StepLabels) >= ThisItem.Value,
                        Index(cmpStepper.StepLabels, ThisItem.Value).Label,
                        ""
                    )
                  Visible: =cmpStepper.Density = "Full"
                  Width: =Parent.TemplateWidth
                  Y: =cntCircle.Y+cntCircle.Height
            - btnStepSelect:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =0
                  Color: =RGBA(0, 0, 0, 0)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisplayMode: |-
                    =Switch(
                        cmpStepper.ClickableSteps,
                        "None", DisplayMode.Disabled,
                        "All", If(
                            ThisItem.Value = cmpStepper.CurrentStep,
                            DisplayMode.Disabled,
                            DisplayMode.Edit
                        ),
                        If(
                            ThisItem.Value < cmpStepper.CurrentStep,
                            DisplayMode.Edit,
                            DisplayMode.Disabled
                        )
                    )
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =cntCircle.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0.05)
                  OnSelect: |-
                    =Set(_stepSel, ThisItem.Value);
                    cmpStepper.OnStepSelect()
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0.08)
                  RadiusBottomLeft: =100
                  RadiusBottomRight: =100
                  RadiusTopLeft: =100
                  RadiusTopRight: =100
                  Text: =""
                  Width: =cntCircle.Width
                  X: =(Parent.TemplateWidth - Switch(cmpStepper.Size, "Small", 22, "Medium", 28, "Large", 34, 28)) / 2
                  Y: =Switch(cmpStepper.Size, "Small", If(cmpStepper.Density="Full",9,2), "Medium", If(cmpStepper.Density="Full",11,2), "Large", If(cmpStepper.Density="Full",14,3), If(cmpStepper.Density="Full",11,2))
